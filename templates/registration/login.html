{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Inventário</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/access.css' %}">
</head>
<body class="access-page">
  <main class="access-shell">
    <a class="brand access-brand" href="{% url 'assets:login' %}"><span class="brand-mark">I</span><span>Inventário<span class="brand-muted"> / TI</span></span></a>
    <section class="access-panel">
      <p class="eyebrow">Acesso restrito</p>
      <h1>Entrar no inventário</h1>
      <p class="access-copy">Use sua conta para consultar e administrar os ativos de TI.</p>
      {% if form.errors %}<p class="access-note" role="alert">Usuário ou senha inválidos. Tente novamente.</p>{% endif %}
      <form method="post" class="login-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="id_username">Usuário</label>
        <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="id_password">Senha</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-primary access-button" type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
